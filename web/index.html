<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Backup Service</title>
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <script>
      // Apply the saved theme before first paint (Graphite by default).
      (function () {
        try {
          var known = { dark: 'dark', ink: 'dark', slate: 'dark', light: 'light', sand: 'light' };
          var saved = localStorage.getItem('bs-theme') || 'dark';
          var theme = saved;
          var scheme = 'dark';
          if (saved === 'system') {
            var light = matchMedia('(prefers-color-scheme: light)').matches;
            theme = light ? 'light' : 'dark';
            scheme = light ? 'light' : 'dark';
          } else if (known[saved]) {
            theme = saved;
            scheme = known[saved];
          } else {
            theme = 'dark';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.scheme = scheme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
